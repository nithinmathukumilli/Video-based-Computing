<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice">
  <style>
    .steam{fill:none;stroke:#C2C7CF;stroke-width:6;stroke-linecap:round;animation:rise 3.5s ease-in-out infinite}
    .s2{animation-delay:1.1s}.s3{animation-delay:2.2s}
    @keyframes rise{0%{opacity:0;transform:translateY(14px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-26px)}}
    .stir{transform-origin:292px 520px;animation:stir 2.4s ease-in-out infinite}
    @keyframes stir{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
    .bite{animation:bite 3s ease-in-out infinite}
    @keyframes bite{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  </style>

  <!-- floor -->
  <rect x="0" y="700" width="1600" height="200" fill="#F3E9D8"/>
  <rect x="0" y="700" width="1600" height="6" fill="#E3D3B8"/>

  <!-- wall shelf with jars and hanging utensils -->
  <rect x="90" y="250" width="380" height="10" fill="#BF9856"/>
  <rect x="120" y="205" width="46" height="45" rx="6" fill="#EEFB87"/>
  <rect x="190" y="215" width="46" height="35" rx="6" fill="#91C1F2"/>
  <rect x="260" y="200" width="46" height="50" rx="6" fill="#3BA184" opacity=".8"/>
  <g stroke="#818995" stroke-width="5" stroke-linecap="round">
    <line x1="380" y1="110" x2="380" y2="190"/><line x1="420" y1="110" x2="420" y2="175"/><line x1="340" y1="110" x2="340" y2="180"/>
    <line x1="330" y1="110" x2="430" y2="110"/>
  </g>
  <circle cx="340" cy="190" r="14" fill="#C2C7CF"/><ellipse cx="420" cy="185" rx="10" ry="16" fill="#C2C7CF"/>

  <!-- kitchen counter and stove -->
  <rect x="60" y="560" width="520" height="140" fill="#D9B98A"/>
  <rect x="50" y="548" width="540" height="20" fill="#BF9856"/>
  <rect x="90" y="590" width="140" height="90" rx="6" fill="#C9A672"/>
  <rect x="260" y="590" width="140" height="90" rx="6" fill="#C9A672"/>
  <rect x="430" y="590" width="120" height="90" rx="6" fill="#C9A672"/>

  <!-- pot on the stove, with steam -->
  <rect x="215" y="480" width="150" height="70" rx="10" fill="#818995"/>
  <rect x="200" y="478" width="180" height="12" rx="6" fill="#525965"/>
  <rect x="190" y="505" width="22" height="10" rx="4" fill="#525965"/><rect x="368" y="505" width="22" height="10" rx="4" fill="#525965"/>
  <path class="steam" d="M250 460 q-14 -24 0 -46 q14 -22 0 -44"/>
  <path class="steam s2" d="M290 460 q-14 -24 0 -46 q14 -22 0 -44"/>
  <path class="steam s3" d="M330 460 q-14 -24 0 -46 q14 -22 0 -44"/>

  <!-- chef -->
  <rect x="425" y="400" width="86" height="150" rx="16" fill="#fff" stroke="#C2C7CF" stroke-width="4"/>
  <rect x="455" y="400" width="26" height="150" fill="#EEFB87" opacity=".7"/>
  <circle cx="468" cy="440" r="4" fill="#818995"/><circle cx="468" cy="470" r="4" fill="#818995"/>
  <circle cx="468" cy="372" r="32" fill="#F1C9A0"/>
  <circle cx="457" cy="368" r="3.5" fill="#1F242F"/><circle cx="479" cy="368" r="3.5" fill="#1F242F"/>
  <path d="M455 382 q13 12 26 0" fill="none" stroke="#1F242F" stroke-width="3" stroke-linecap="round"/>
  <rect x="440" y="318" width="56" height="30" fill="#fff" stroke="#C2C7CF" stroke-width="3"/>
  <circle cx="446" cy="312" r="20" fill="#fff" stroke="#C2C7CF" stroke-width="3"/>
  <circle cx="468" cy="300" r="24" fill="#fff" stroke="#C2C7CF" stroke-width="3"/>
  <circle cx="490" cy="312" r="20" fill="#fff" stroke="#C2C7CF" stroke-width="3"/>
  <rect x="440" y="334" width="56" height="16" fill="#fff"/>
  <!-- chef arm stirring with a spoon -->
  <g class="stir">
    <line x1="430" y1="440" x2="330" y2="470" stroke="#fff" stroke-width="24" stroke-linecap="round"/>
    <line x1="430" y1="440" x2="330" y2="470" stroke="#C2C7CF" stroke-width="3" stroke-linecap="round" opacity=".6"/>
    <line x1="322" y1="472" x2="292" y2="520" stroke="#BF9856" stroke-width="8" stroke-linecap="round"/>
    <circle cx="322" cy="472" r="13" fill="#F1C9A0"/>
  </g>

  <!-- table 1 with two diners -->
  <rect x="940" y="600" width="520" height="18" rx="4" fill="#BF9856"/>
  <rect x="980" y="618" width="14" height="82" fill="#A07E3E"/><rect x="1406" y="618" width="14" height="82" fill="#A07E3E"/>
  <!-- diner A -->
  <rect x="1000" y="470" width="110" height="130" rx="30" fill="#3BA184"/>
  <circle cx="1055" cy="436" r="32" fill="#F1C9A0"/>
  <path d="M1023 428 q32 -40 64 0 q-32 -10 -64 0z" fill="#393F4A"/>
  <circle cx="1044" cy="440" r="3.5" fill="#1F242F"/><circle cx="1066" cy="440" r="3.5" fill="#1F242F"/>
  <path d="M1044 454 q11 9 22 0" fill="none" stroke="#1F242F" stroke-width="3" stroke-linecap="round"/>
  <g class="bite"><line x1="1085" y1="520" x2="1130" y2="470" stroke="#3BA184" stroke-width="20" stroke-linecap="round"/><circle cx="1134" cy="464" r="9" fill="#F1C9A0"/></g>
  <!-- diner B -->
  <rect x="1290" y="470" width="110" height="130" rx="30" fill="#91C1F2"/>
  <circle cx="1345" cy="436" r="32" fill="#E0AC82"/>
  <path d="M1311 432 q34 -48 68 0 q-34 -14 -68 0z" fill="#1F242F"/>
  <circle cx="1334" cy="440" r="3.5" fill="#1F242F"/><circle cx="1356" cy="440" r="3.5" fill="#1F242F"/>
  <path d="M1334 454 q11 9 22 0" fill="none" stroke="#1F242F" stroke-width="3" stroke-linecap="round"/>
  <!-- plates and food -->
  <ellipse cx="1130" cy="598" rx="52" ry="9" fill="#fff"/><ellipse cx="1130" cy="593" rx="30" ry="6" fill="#EEFB87"/>
  <ellipse cx="1270" cy="598" rx="52" ry="9" fill="#fff"/><ellipse cx="1270" cy="593" rx="30" ry="6" fill="#3BA184" opacity=".7"/>
  <rect x="1190" y="560" width="30" height="40" rx="6" fill="#91C1F2"/>

  <!-- table 2 with one diner, further back -->
  <rect x="640" y="640" width="250" height="14" rx="4" fill="#C9A672"/>
  <rect x="665" y="654" width="10" height="46" fill="#A07E3E"/><rect x="855" y="654" width="10" height="46" fill="#A07E3E"/>
  <rect x="770" y="530" width="84" height="110" rx="26" fill="#BF9856"/>
  <circle cx="812" cy="502" r="26" fill="#F1C9A0"/>
  <path d="M786 498 q26 -34 52 0 q-26 -8 -52 0z" fill="#818995"/>
  <circle cx="803" cy="505" r="3" fill="#1F242F"/><circle cx="821" cy="505" r="3" fill="#1F242F"/>
  <path d="M803 516 q9 7 18 0" fill="none" stroke="#1F242F" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="715" cy="638" rx="40" ry="7" fill="#fff"/><ellipse cx="715" cy="634" rx="22" ry="5" fill="#BF9856" opacity=".8"/>

  <!-- hanging lamps -->
  <g fill="#EEFB87" stroke="#BF9856" stroke-width="3">
    <line x1="1100" y1="0" x2="1100" y2="300" stroke="#818995"/><path d="M1060 330 q40 -64 80 0z"/>
    <line x1="1300" y1="0" x2="1300" y2="270" stroke="#818995"/><path d="M1260 300 q40 -64 80 0z"/>
    <line x1="760" y1="0" x2="760" y2="330" stroke="#818995"/><path d="M720 360 q40 -64 80 0z"/>
  </g>
</svg>
